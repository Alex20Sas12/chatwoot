name: demo-chatwoot

on:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prep
        run: |
          mkdir -p .cw && cd .cw
          curl -sL -o compose.yml https://raw.githubusercontent.com/chatwoot/chatwoot/develop/docker-compose.production.yaml
          curl -sL -o .env https://raw.githubusercontent.com/chatwoot/chatwoot/develop/.env.example
          # compose хардкодит пустой POSTGRES_PASSWORD= -> делаем интерполяцией из env
          sed -i 's|- POSTGRES_PASSWORD=$|- POSTGRES_PASSWORD=${POSTGRES_PASSWORD}|' compose.yml
          sed -i "s|version: '3'|# compose v2|" compose.yml
          export POSTGRES_PASSWORD=cw_demo_pw
          {
            echo SECRET_KEY_BASE=$(openssl rand -hex 32)
            echo POSTGRES_HOST=postgres
            echo POSTGRES_USERNAME=postgres
            echo POSTGRES_PASSWORD=cw_demo_pw
            echo POSTGRES_DATABASE=chatwoot
            echo REDIS_URL=redis://redis:6379
            echo INSTALLATION_ENV=github-action
          } >> .env
          echo POSTGRES_PASSWORD=cw_demo_pw >> $GITHUB_ENV
          docker compose pull postgres redis
          docker compose up -d postgres redis
          for i in $(seq 1 30); do sleep 3; docker compose exec -T postgres pg_isready -U postgres >/dev/null 2>&1 && echo PG-READY && break; done
      - name: Tunnel
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd .cw
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared && chmod +x /usr/local/bin/cloudflared
          cloudflared tunnel --url http://localhost:3000 --no-autoupdate > tunnel.log 2>&1 &
          URL=""
          for i in $(seq 1 24); do sleep 5; URL=$(grep -oE 'https://[a-z0-9-]+[.]trycloudflare[.]com' tunnel.log | head -1); [ -n "$URL" ] && break; done
          echo "PUBLIC-DEMO-URL: $URL"
          echo FRONTEND_URL=$URL >> .env
          echo "$URL" > ../demo_url.txt
          if [ -n "$URL" ]; then
            curl -s -X POST "$SUPABASE_URL/rest/v1/leads" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" -H "Content-Type: application/json" -H "Prefer: return=minimal" -d "{\"email\":\"demo-url@deskflat.local\",\"source\":\"{\\\"src\\\":\\\"demo\\\",\\\"icp\\\":\\\"$URL\\\"}\"}"
          fi
      - name: Up
        run: |
          cd .cw
          # миграции ПЕРВЫМ делом (one-shot run): rails server без таблиц падает в crash-loop (урок прогона 36193491530)
          docker compose run --rm rails bundle exec rails db:chatwoot_prepare
          docker compose up -d rails sidekiq
          ok=""
          for i in $(seq 1 90); do sleep 5; if docker compose exec -T rails curl -sf http://localhost:3000 >/dev/null 2>&1; then ok=1; break; fi; done
          if [ -z "$ok" ]; then echo '=== PS ==='; docker compose ps -a; echo '=== RAILS LOGS ==='; docker compose logs rails --tail 120; exit 1; fi
          echo CHATWOOT-UP
          curl -sf "$(cat ../demo_url.txt)" -o /dev/null && echo TUNNEL-OK || echo TUNNEL-CHECK-FAIL
      - name: Hold
        run: sleep 21000
